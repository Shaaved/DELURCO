<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URC Admin Dashboard</title>
    <!-- Reusing our military stylesheet -->
    
    <style>
        /* Specific styles for the admin table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #FAFAFA;
        }
        th, td {
            border: 1px solid #8A9A5B;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4B5320;
            color: #F5F5DC;
            text-transform: uppercase;
        }
        .status-packed {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 1000px;">
    <h1>URC Dispatch Command Center</h1>
    <div class="section">
        <h2>Current Active Orders</h2>
        <button onclick="loadAdminOrders()" style="margin-bottom: 15px;">Refresh Orders</button>
        
        <table id="orders-table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date/Time</th>
                    <th>Smart Card</th>
                    <th>Beneficiary Name</th>
                    <th>Amount (₹)</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="orders-body">
                <!-- Orders will load here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE_URL = "http://127.0.0.1:8000";

    async function loadAdminOrders() {
        const tableBody = document.getElementById("orders-body");
        tableBody.innerHTML = "<tr><td colspan='7'><em>Loading orders from secure server...</em></td></tr>";

        try {
            const response = await fetch(`${API_BASE_URL}/admin/orders`);
            const data = await response.json();
            
            tableBody.innerHTML = "";
            
            if (data.orders.length === 0) {
                tableBody.innerHTML = "<tr><td colspan='7'>No active orders.</td></tr>";
                return;
            }

            data.orders.forEach(order => {
                let itemsListHTML = "<ul style='margin:0; padding-left:20px; font-size:14px;'>";
                order.items.forEach(item => {
                    itemsListHTML += `<li>${item.name} (₹${item.price})</li>`;
                });
                itemsListHTML += "</ul>";

                // Determine the next logical status
                let actionButton = "";
                if (order.status.toLowerCase() === "packed") {
                    actionButton = `<button onclick="updateStatus(${order.order_id}, 'out_for_delivery')" style="background-color: #d35400; padding: 5px 10px; font-size: 12px;">Dispatch</button>`;
                } else if (order.status.toLowerCase() === "out_for_delivery") {
                    actionButton = `<button onclick="updateStatus(${order.order_id}, 'delivered')" style="background-color: #27ae60; padding: 5px 10px; font-size: 12px;">Mark Delivered</button>`;
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>#${order.order_id}</td>
                    <td>${order.date}</td>
                    <td>${order.smart_card_id}</td>
                    <td>
                        <strong>${order.name}</strong><br>
                        ${itemsListHTML}
                    </td>
                    <td>₹${order.total_amount}</td>
                    <td class="status-${order.status.toLowerCase()}">${order.status.replace(/_/g, ' ').toUpperCase()}</td>
                    <td>${actionButton}</td>
                `;
                tableBody.appendChild(tr);
            });
        } catch (error) {
            tableBody.innerHTML = "<tr><td colspan='7' style='color:red;'>Failed to load orders. Check server connection.</td></tr>";
        }
    }

    // NEW: Function to send the status update to the backend
    async function updateStatus(orderId, newStatus) {
        try {
            const response = await fetch(`${API_BASE_URL}/admin/orders/${orderId}/status`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: newStatus })
            });

            if (response.ok) {
                // Refresh the table to show the new status
                loadAdminOrders();
            } else {
                alert("Failed to update status.");
            }
        } catch (error) {
            alert("Error communicating with server.");
        }
    }

    window.onload = loadAdminOrders;
</script>

</body>
</html>
