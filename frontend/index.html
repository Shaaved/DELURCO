<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELURCO | Canteen Access</title>
    
    <!-- 1. The Tailwind Compiler -->
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<!-- 2. Body Styling: Dark background, centered content, full height -->
<body class="min-h-screen flex items-center justify-center bg-slate-900 font-sans m-0">

    <!-- 3. The Pinned Navbar -->
    <nav class="absolute top-0 left-0 w-full px-10 py-5 flex justify-between items-center bg-slate-800 shadow-lg box-border">
        <h2 class="text-white text-2xl tracking-wide font-bold m-0">DELURCO</h2>
        
        <div class="flex gap-8">
            <a href="#" class="text-slate-300 hover:text-emerald-500 font-medium no-underline transition-colors duration-300">Home</a>
            <a href="#" class="text-slate-300 hover:text-emerald-500 font-medium no-underline transition-colors duration-300">About</a>
            <a href="#" class="text-slate-300 hover:text-emerald-500 font-medium no-underline transition-colors duration-300">Contact</a>
        </div>
    </nav>

    <!-- 4. The Centered Login Card -->
    <div class="bg-slate-800 p-10 rounded-xl shadow-2xl w-full max-w-sm text-center">
        
        <div class="mb-6">
            <h2 class="mt-0 mb-2 text-emerald-500 text-2xl font-bold tracking-wide">LOGIN</h2>
            <p class="text-slate-300 text-sm">Enter your Smart Card ID to continue</p>
        </div>

        <div>
            <!-- Input Field -->
            <input type="text" id="smart-card-input" placeholder="e.g. CSD-1001" autocomplete="off"
                class="w-full p-3 my-5 rounded-md border border-slate-700 bg-slate-900 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
            
            <!-- Login Button -->
            <button id="loginBtn" onclick="verifyQuota()" 
                class="w-full p-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-md cursor-pointer transition-colors duration-200">
                SECURE LOGIN
            </button>
            
            <p id="loginError" class="text-red-500 text-sm mt-4 hidden">Invalid ID. Please try again.</p>
        </div>
    </div>
    <!-- Slide-out Cart Panel (Hidden by default via translate-x-full) -->
<div id="cart-slideout" class="fixed top-0 right-0 w-96 h-full bg-gray-900 border-l border-gray-700 shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
    <!-- Header -->
    <div class="p-6 border-b border-gray-800 flex justify-between items-center">
        <h2 class="text-2xl font-bold text-white">Your Cart</h2>
        <button onclick="toggleCart()" class="text-gray-400 hover:text-white font-bold text-xl">✖</button>
    </div>
    
    <!-- Cart Items Container -->
    <div id="cart-items-container" class="flex-1 p-6 overflow-y-auto space-y-4">
        <!-- JavaScript will inject cart items here -->
        <p class="text-gray-500 text-center mt-10">Your cart is empty.</p>
    </div>
    
    <!-- Footer / Checkout -->
    <div class="p-6 border-t border-gray-800 bg-gray-950">
        <div class="flex justify-between items-center mb-4 text-white font-bold text-lg">
            <span>Total:</span>
            <span id="cart-total" class="text-emerald-400">₹0</span>
        </div>
        <button id="checkout-btn" onclick="processCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition-colors">
            SECURE CHECKOUT
        </button>
    </div>
</div>

    <!-- Link your JS -->
    <script src="script.js"></script>
</body>
</html>
