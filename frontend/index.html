<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELURC | Canteen Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    
    <div class="login-container">
        <!-- Logo or App Name -->
        <div class="login-header">
            <h2>LOGIN</h2>
            <p>Enter your Smart Card ID to continue</p>
        </div>

        <!-- Authentication Form -->
        <div class="login-form">
            <input type="text" id="userIdInput" placeholder="e.g. CSD-1001" autocomplete="off">
            <button id="loginBtn" onclick="verifyLogin()">SECURE LOGIN</button>
            <p id="loginError" class="error-text" style="display: none;">Invalid ID. Please try again.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
