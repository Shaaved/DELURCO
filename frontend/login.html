<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELURCO - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center text-gray-200">

    <div class="bg-gray-900 border border-gray-800 p-10 rounded-2xl shadow-2xl w-full max-w-md flex flex-col items-center">
        <!-- Logo -->
        <div class="text-4xl font-bold tracking-widest text-emerald-400 mb-2">DELURCO</div>
        <p class="text-gray-400 mb-8 text-sm text-center">Smart Campus Canteen System</p>

        <!-- Login Form -->
        <div class="w-full space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Smart Card ID</label>
                <input type="text" id="smart-card-id" placeholder="e.g., 24BCE1001" 
                       class="w-full bg-gray-800 border border-gray-700 text-white px-4 py-3 rounded-lg outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all uppercase">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">4-Digit PIN</label>
                <input type="password" id="pin" placeholder="••••" maxlength="4"
                       class="w-full bg-gray-800 border border-gray-700 text-white px-4 py-3 rounded-lg outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-center tracking-widest text-lg">
            </div>

            <button onclick="attemptLogin()" id="login-btn" 
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg mt-4 transition-colors shadow-lg shadow-emerald-600/20">
                AUTHENTICATE
            </button>
        </div>
        
        <!-- Error Message (Hidden by default) -->
        <p id="login-error" class="text-red-500 text-sm mt-4 hidden font-medium"></p>
    </div>

    <!-- We need the base URL to connect to the backend -->
    <script src="script.js"></script>
</body>
</html>
