<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELURCO | Dashboard</title>
    <!-- Tailwind Compiler -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col">

   <!-- 1. Top Navigation Bar -->
<nav class="flex justify-between items-center p-6 bg-gray-900 text-white shadow-md">
    <div class="text-2xl font-bold tracking-widest text-emerald-400">DELURC</div>
    <div class="flex space-x-4">
        <button id="cart-btn" class="bg-gray-800 border border-gray-700 hover:bg-gray-700 px-5 py-2 rounded-lg font-medium transition-colors">
            🛒 Cart (<span id="cart-count">0</span>)
        </button>
        <button id="logout-btn" class="bg-red-600/20 text-red-500 border border-red-500/50 hover:bg-red-600 hover:text-white px-5 py-2 rounded-lg font-medium transition-colors">
            Logout
        </button>
    </div>
</nav>

<!-- 2. Main Center Categories -->
<main class="flex flex-col items-center justify-center mt-32">
    <h1 class="text-4xl font-bold text-gray-100 mb-12">What are you looking for today?</h1>
    
    <div class="grid grid-cols-4 gap-12">
        <!-- Electronics -->
        <a href="electronics.html" class="group flex flex-col items-center cursor-pointer">
            <div class="w-36 h-36 bg-indigo-600 rounded-full flex items-center justify-center text-5xl shadow-lg group-hover:scale-110 group-hover:shadow-indigo-500/50 transition-all duration-300">💻</div>
            <span class="mt-6 text-lg font-semibold text-gray-300 group-hover:text-white transition-colors">Electronics</span>
        </a>
        
        <!-- Grocery -->
        <a href="grocery.html" class="group flex flex-col items-center cursor-pointer">
            <div class="w-36 h-36 bg-emerald-600 rounded-full flex items-center justify-center text-5xl shadow-lg group-hover:scale-110 group-hover:shadow-emerald-500/50 transition-all duration-300">🍎</div>
            <span class="mt-6 text-lg font-semibold text-gray-300 group-hover:text-white transition-colors">Grocery</span>
        </a>
        
        <!-- Fresh -->
        <a href="fresh.html" class="group flex flex-col items-center cursor-pointer">
            <div class="w-36 h-36 bg-sky-500 rounded-full flex items-center justify-center text-5xl shadow-lg group-hover:scale-110 group-hover:shadow-sky-500/50 transition-all duration-300">🥬</div>
            <span class="mt-6 text-lg font-semibold text-gray-300 group-hover:text-white transition-colors">Fresh</span>
        </a>
        
        <!-- Vehicles -->
        <a href="vehicles.html" class="group flex flex-col items-center cursor-pointer">
            <div class="w-36 h-36 bg-amber-500 rounded-full flex items-center justify-center text-5xl shadow-lg group-hover:scale-110 group-hover:shadow-amber-500/50 transition-all duration-300">🚗</div>
            <span class="mt-6 text-lg font-semibold text-gray-300 group-hover:text-white transition-colors">Vehicles</span>
        </a>
    </div>
</main>

<!-- 3. The Toast Popup (Hidden by default) -->
<div id="toast-notification" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white px-6 py-4 rounded-full shadow-2xl transition-all duration-500 opacity-0 translate-y-10 pointer-events-none z-50 flex items-center space-x-4">
    <span id="toast-message" class="font-medium">Item added!</span>
    <button onclick="processCheckout()" class="bg-white text-emerald-700 px-4 py-1 rounded-full text-sm font-bold hover:bg-gray-100 transition-colors">
        Checkout
    </button>
</div>

<!-- 4. Floating AI Assistant Widget -->
<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
    
    <!-- The Chat Window (Hidden by default) -->
    <div id="ai-chat-window" class="hidden w-[350px] bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl mb-4 flex-col overflow-hidden transition-all">
        <div class="bg-gray-800 p-4 flex justify-between items-center border-b border-gray-700">
            <span class="font-bold text-white flex items-center space-x-2">
                <span>🤖</span>
                <span>DELURC AI</span>
            </span>
            <button onclick="toggleChat()" class="text-gray-400 hover:text-white font-bold">✖</button>
        </div>
        
        <!-- Chat History -->
        <div id="chat-history" class="h-80 p-4 overflow-y-auto text-sm text-gray-300 space-y-4">
            <!-- JavaScript will inject bubbles here -->
        </div>
        
        <!-- Input Area -->
        <div class="p-3 bg-gray-800 border-t border-gray-700 flex">
            <input type="text" id="chat-input" class="flex-1 bg-gray-700 text-white rounded-l-lg px-4 py-2 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Ask for items...">
            <button id="send-btn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-r-lg font-bold text-white transition-colors">Send</button>
        </div>
    </div>

    <!-- The Floating Action Button (FAB) -->
    <button onclick="toggleChat()" class="w-16 h-16 bg-emerald-600 rounded-full shadow-2xl flex items-center justify-center text-3xl hover:bg-emerald-500 hover:scale-105 transition-all">
        🤖
    </button>
</div>
        
    </main>

    <script src="script.js"></script>
    <script>
        // Quick script to pull the ID from localStorage and display it
        const loggedInCard = localStorage.getItem("loggedInCard");
        if (loggedInCard) {
            document.getElementById("display-card-id").innerText = loggedInCard;
        } else {
            // Kick them back to login if they bypassed it
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
